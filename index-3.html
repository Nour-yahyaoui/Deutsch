<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprachpass — جواز اللغة</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A44;
    --paper:#F0F2EC;
    --paper-2:#E6E9DF;
    --stamp:#B97A2C;
    --stamp-2:#7C8F6E;
    --line:#CBD1C2;
  }
  html,body{ background:var(--paper); }
  body{ font-family:'Cairo','Inter',sans-serif; color:var(--ink); }
  .font-de{ font-family:'Fraunces','Cairo',serif; }
  .stamp-ring{
    border:2px solid currentColor;
    border-radius:9999px;
  }
  .stamp-ring::before{
    content:"";
    position:absolute; inset:4px;
    border:1px dashed currentColor;
    border-radius:9999px;
    opacity:.45;
  }
  ::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  @keyframes pop{ 0%{ transform:scale(.9); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  .pop-in{ animation:pop .18s ease-out; }
  @keyframes fillbar{ from{ width:0; } }
  .xp-fill{ animation:fillbar .5s ease-out; }
</style>
</head>
<body class="min-h-screen" style="padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);">

<div id="app" class="max-w-md mx-auto min-h-screen flex flex-col"></div>

<script>
const STORAGE_KEY = 'sprachpass_progress_v1';

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { learned: {}, xp: 0 };
  }catch(e){ return { learned: {}, xp: 0 }; }
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
}

let DATA = null;
let progress = loadProgress();
let view = { screen: 'home', courseId: null, lessonId: null };

const XP_PER_ITEM = 10;

function countCourseItems(course){
  return course.lessons.reduce((n,l)=> n + l.items.length, 0);
}
function countCourseLearned(course){
  return course.lessons.reduce((n,l)=> n + l.items.filter(it=>progress.learned[it.id]).length, 0);
}
function totalItems(){
  return DATA.courses.reduce((n,c)=> n + countCourseItems(c), 0);
}
function totalLearned(){
  return Object.keys(progress.learned).filter(k=>progress.learned[k]).length;
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderTopBar());
  const body = el('div','flex-1 px-4 pb-10');
  if(view.screen === 'home') body.appendChild(renderHome());
  else if(view.screen === 'course') body.appendChild(renderCourse());
  else if(view.screen === 'lesson') body.appendChild(renderLesson());
  app.appendChild(body);
}

function renderTopBar(){
  const bar = el('div','sticky top-0 z-10 backdrop-blur border-b');
  bar.style.background = 'rgba(240,242,236,0.9)';
  bar.style.borderColor = 'var(--line)';
  bar.style.paddingTop = 'env(safe-area-inset-top,0px)';

  const inner = el('div','max-w-md mx-auto px-4 py-3 flex items-center gap-3');

  if(view.screen !== 'home'){
    const back = el('button','shrink-0 w-9 h-9 rounded-full flex items-center justify-center border text-sm');
    back.style.borderColor = 'var(--ink)';
    back.textContent = '›';
    back.onclick = ()=>{
      if(view.screen === 'lesson'){ view.screen = 'course'; view.lessonId = null; }
      else { view.screen = 'home'; view.courseId = null; }
      render();
    };
    inner.appendChild(back);
  }

  const titleWrap = el('div','flex-1 min-w-0');
  const title = el('div','font-de font-semibold text-lg leading-tight truncate',
    view.screen === 'home' ? 'Sprachpass' :
    view.screen === 'course' ? DATA.courses.find(c=>c.id===view.courseId).title_de :
    DATA.courses.find(c=>c.id===view.courseId).lessons.find(l=>l.id===view.lessonId).title_de
  );
  const sub = el('div','text-xs opacity-60 truncate',
    view.screen === 'home' ? DATA.meta.subtitle_ar :
    view.screen === 'course' ? DATA.courses.find(c=>c.id===view.courseId).title_ar :
    DATA.courses.find(c=>c.id===view.courseId).lessons.find(l=>l.id===view.lessonId).title_ar
  );
  titleWrap.appendChild(title); titleWrap.appendChild(sub);
  inner.appendChild(titleWrap);

  const xpTotal = totalItems();
  const xpDone = totalLearned();
  const pct = xpTotal ? Math.round((xpDone/xpTotal)*100) : 0;

  const xpBadge = el('div','shrink-0 text-left');
  xpBadge.innerHTML = `
    <div class="text-xs font-semibold" style="color:var(--stamp)">${progress.xp} XP</div>
    <div class="w-16 h-1.5 rounded-full mt-1" style="background:var(--paper-2)">
      <div class="h-1.5 rounded-full xp-fill" style="width:${pct}%; background:var(--stamp)"></div>
    </div>
  `;
  inner.appendChild(xpBadge);

  bar.appendChild(inner);
  return bar;
}

function renderHome(){
  const wrap = el('div','pt-4');

  const hero = el('div','mb-6 p-4 rounded-2xl');
  hero.style.background = 'var(--paper-2)';
  hero.innerHTML = `
    <div class="font-de text-2xl font-semibold">Willkommen 👋</div>
    <div class="text-sm mt-1 opacity-80">مستوى A2 — اجمع طوابع الدروس وتعلّم الألمانية بالعربية</div>
  `;
  wrap.appendChild(hero);

  const grid = el('div','grid grid-cols-2 gap-3');
  DATA.courses.forEach(course=>{
    const items = countCourseItems(course);
    const learned = countCourseLearned(course);
    const done = items > 0 && learned === items;

    const card = el('button','text-right p-3 rounded-2xl border flex flex-col gap-3 items-start');
    card.style.borderColor = 'var(--line)';
    card.style.background = done ? 'var(--paper-2)' : '#fff';

    const badgeColor = done ? 'var(--stamp)' : 'var(--stamp-2)';
    const badge = el('div','relative w-11 h-11 flex items-center justify-center font-de font-bold text-sm stamp-ring');
    badge.style.color = badgeColor;
    badge.textContent = course.badge;

    const titleBlock = el('div','w-full');
    titleBlock.innerHTML = `
      <div class="font-de font-semibold text-sm leading-tight">${course.title_de}</div>
      <div class="text-xs opacity-70 mt-0.5">${course.title_ar}</div>
      <div class="text-[11px] mt-2 opacity-60">${learned}/${items}</div>
    `;

    card.appendChild(badge);
    card.appendChild(titleBlock);
    card.onclick = ()=>{ view.screen='course'; view.courseId=course.id; render(); };
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderCourse(){
  const course = DATA.courses.find(c=>c.id===view.courseId);
  const wrap = el('div','pt-4 flex flex-col gap-3');

  course.lessons.forEach(lesson=>{
    const items = lesson.items.length;
    const learned = lesson.items.filter(it=>progress.learned[it.id]).length;
    const pct = items ? Math.round((learned/items)*100) : 0;

    const card = el('button','w-full text-right p-4 rounded-2xl border flex items-center gap-3');
    card.style.borderColor = 'var(--line)';
    card.style.background = '#fff';

    const ring = el('div','relative w-10 h-10 shrink-0 rounded-full flex items-center justify-center text-xs font-semibold');
    ring.style.background = pct===100 ? 'var(--stamp)' : 'var(--paper-2)';
    ring.style.color = pct===100 ? '#fff' : 'var(--ink)';
    ring.textContent = pct===100 ? '✓' : pct+'%';

    const info = el('div','flex-1 min-w-0');
    info.innerHTML = `
      <div class="font-de font-semibold text-sm">${lesson.title_de}</div>
      <div class="text-xs opacity-70">${lesson.title_ar}</div>
      <div class="w-full h-1.5 rounded-full mt-2" style="background:var(--paper-2)">
        <div class="h-1.5 rounded-full" style="width:${pct}%; background:var(--stamp-2)"></div>
      </div>
    `;

    card.appendChild(ring);
    card.appendChild(info);
    card.onclick = ()=>{ view.screen='lesson'; view.lessonId=lesson.id; render(); };
    wrap.appendChild(card);
  });

  return wrap;
}

function renderLesson(){
  const course = DATA.courses.find(c=>c.id===view.courseId);
  const lesson = course.lessons.find(l=>l.id===view.lessonId);
  const wrap = el('div','pt-4 flex flex-col gap-2.5');

  lesson.items.forEach(item=>{
    const isLearned = !!progress.learned[item.id];
    const card = el('div','p-4 rounded-2xl border flex items-center gap-3 pop-in');
    card.style.borderColor = 'var(--line)';
    card.style.background = isLearned ? 'var(--paper-2)' : '#fff';

    const check = el('button','shrink-0 w-8 h-8 rounded-full border flex items-center justify-center text-sm');
    check.style.borderColor = isLearned ? 'var(--stamp)' : 'var(--line)';
    check.style.background = isLearned ? 'var(--stamp)' : 'transparent';
    check.style.color = isLearned ? '#fff' : 'var(--ink)';
    check.textContent = isLearned ? '✓' : '';
    check.onclick = ()=>{
      if(progress.learned[item.id]){
        delete progress.learned[item.id];
        progress.xp = Math.max(0, progress.xp - XP_PER_ITEM);
      } else {
        progress.learned[item.id] = true;
        progress.xp += XP_PER_ITEM;
      }
      saveProgress(progress);
      render();
    };

    const text = el('div','flex-1 min-w-0 text-right');
    text.innerHTML = `
      <div class="font-de text-base font-semibold" dir="ltr" style="text-align:right">${item.de}</div>
      <div class="text-sm mt-0.5">${item.ar}</div>
      <div class="text-xs opacity-60 mt-1">${item.pron}</div>
    `;

    card.appendChild(check);
    card.appendChild(text);
    wrap.appendChild(card);
  });

  return wrap;
}

async function init(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="flex-1 flex items-center justify-center text-sm opacity-60">... جارٍ التحميل</div>';
  try{
    const res = await fetch('data.json');
    DATA = await res.json();
  }catch(e){
    app.innerHTML = '<div class="flex-1 flex items-center justify-center text-center text-sm opacity-70 px-6">تعذّر تحميل data.json — تأكد من فتح الملف عبر خادم محلي (localhost) وليس مباشرة من نظام الملفات</div>';
    return;
  }
  render();
}

init();
</script>
</body>
</html>
